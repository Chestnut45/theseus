CutscenesAndDialogues:
  intro_cutscene:
    characters:
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
      - name: "Theseus"
        portraitPath: "data/textures/TheseusPortrait.png"
    sequence:
      - type: "dialogue"
        character: "Ariadne"
        text: "I am sorry that I cannot help you more."
        duration: 4.0
      - type: "dialogue"
        character: "Theseus"
        text: "No my lady, freeing me from your father's prison was help enough."
        duration: 2.0
      - type: "dialogue"
        character: "Ariadne"
        text: "Very well. Be careful Theseus."
        duration: 4.0
  hello:
    characters:
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
    sequence:
      - type: "dialogue"
        character: "Ariadne"
        text: "Hello, Theseus."
        duration: 2.0
  traps:
    characters:
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
    sequence:
      - type: "dialogue"
        character: "Ariadne"
        text: "Pay attention to the floors, Theseus."
        duration: 2.0
      - type: "dialogue"
        character: "Ariadne"
        text: "Daedalus has informed me that the rooms and halls are filled with traps."
        duration: 2.0
  the_center_is_dangerous:
    characters:
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
    sequence:
      - type: "dialogue"
        character: "Ariadne"
        text: "I have heard that the most dangerous monsters lurk around the center of the Labyrinth."
        duration: 2.0
      - type: "dialogue"
        character: "Ariadne"
        text: "It would be wise to explore the edges of the Labyrinth before you make your way to the center."
        duration: 2.0
  survivors:
    characters:
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
    sequence:
      - type: "dialogue"
        character: "Ariadne"
        text: "Your people are strong, Theseus. It is possible that some of them may still be wandering these halls."
        duration: 2.0
        
