CutscenesAndDialogues:
  intro_sequence:
    characters:
      - name: "Theseus"
        portraitPath: "data/textures/TheseusPortrait.png"
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
    sequence:
      - type: "fade"
        from: "black"
        duration: 1.5
      - type: "cutscene"
        camera_keyframes:
          - target: "Theseus"
            zoom: 1.0
            duration: 0.25
      - type: "combined"
        dialogue:
          character: "Ariadne"
          text: "This is it, Theseus."
          duration: 2.5
        cutscene:
          camera_keyframes:
            - target: "Ariadne"
              zoom: 1.0
              duration: 1.5
      - type: "dialogue"
        character: "Ariadne"
        text: "This is the Labyrinth."
        duration: 2.5
      - type: "combined"
        dialogue:
          character: "Ariadne"
          text: "There are many monsters here."
          duration: 2.5
        cutscene:
          camera_keyframes:
            - target: "Minitaur"
              zoom: 1.0
              duration: 1.5
      - type: "dialogue"
        character: "Ariadne"
        text: "No one has ever entered the labyrinth and lived to tell the tale."
        duration: 3.0
      - type: "combined"
        dialogue:
          character: "Theseus"
          text: "My people are counting on me, princess. There is no turning back now."
          duration: 3.5
        cutscene:
          camera_keyframes:
            - target: "Theseus"
              zoom: 1.0
              duration: 2.0
      - type: "combined"
        dialogue:
          character: "Ariadne"
          text: "Very well."
          duration: 2.0
        cutscene:
          camera_keyframes:
            - target: "Ariadne"
              zoom: 1.0
              duration: 1.5
      - type: "dialogue"
        character: "Ariadne"
        text: "You will find the big minotaur in the center of the labyrinth, but I would advise you not to face him immediately."
        duration: 4.0
      - type: "combined"
        dialogue:
          character: "Ariadne"
          text: "I gave you a schematic. Use it to operate the dispensaries throughout the labyrinth."
          duration: 3.5
        cutscene:
          camera_keyframes:
            - target: "Dispensary"
              zoom: 1.0
              duration: 2.0
      - type: "dialogue"
        character: "Ariadne"
        text: "They were built by my friend Daedalus."
        duration: 2.5
      - type: "combined"
        dialogue:
          character: "Theseus"
          text: "Thank you, my lady. See you when I'm done with the top dawg."
          duration: 3.5
        cutscene:
          camera_keyframes:
            - target: "Theseus"
              zoom: 1.0
              duration: 2.0
      - type: "fade"
        to: "black"
        duration: 1.5
  
  special_intro_sequence:
    characters:
      - name: "Theseus"
        portraitPath: "data/textures/TheseusPortrait.png"
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
    sequence:
      - type: "fade"
        from: "black"
        duration: 1.5
      - type: "cutscene"
        camera_keyframes:
          - target: "Theseus"
            zoom: 1.0
            duration: 0.25
      - type: "combined"
        dialogue:
          character: "Ariadne"
          text: "Where are we...?"
          duration: 2.5
        cutscene:
          camera_keyframes:
            - target: "Ariadne"
              zoom: 1.0
              duration: 1.5
      - type: "fade"
        to: "black"
        duration: 1.5

  hello:
    characters:
      - name: "Ariadne"
        portraitPath: "data/textures/AriadnePortrait.png"
    sequence:
      - type: "dialogue"
        character: "Ariadne"
        text: "Hello, Theseus."
        duration: 2.0
