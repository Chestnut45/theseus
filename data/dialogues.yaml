dialogue:
  - id: "intro_1"
    event: "player_meets_npc"
    characters:
      - name: "Theseus"
        portraitPath: "data/textures/sPlayerTest.png"
        expression: "neutral"
      - name: "Minotaur"
        portraitPath: "data/textures/minitaur.png"
        expression: "angry"
    lines:
      - character: "Theseus"
        text: "I finally found you, Minotaur!"
        duration: 2.0
      - character: "Minotaur"
        text: "You won't leave this labyrinth alive!"
        duration: 3.0
  - id: "victory"
    event: "minotaur_defeated"
    characters:
      - name: "Theseus"
        portraitPath: "data/textures/sPlayerTest.png"
        expression: "smile"
    lines:
      - character: "Theseus"
        text: "It's over, Minotaur. The Labyrinth is free!"
        duration: 4.0
