cutscenes:
  gorgon_cutscene:
    camera_keyframes:
      - position: [6000, 6000]  # Start at Theseus' position
        zoom: 1.0
        duration: 2.0
      - position: [9000, 3000]  # Move to Gorgon's position
        zoom: 0.8
        duration: 3.0

  outro:
    camera_keyframes:
      - position: [30, 15]
        duration: 2.5
      - position: [40, 20]
        duration: 3.0
      - position: [50, 25]
        duration: 1.5
