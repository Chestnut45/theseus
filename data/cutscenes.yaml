cutscenes:
  gorgon_cutscene:
    camera_keyframes:
      - target: "Theseus"  # Start with the camera on Theseus
        zoom: 1.0
        duration: 0.3
      - target: "Gorgon"  # Move camera to the Gorgon
        zoom: 1.0
        duration: 3.0
  theseus_cutscene:
    camera_keyframes:
      - target: "Theseus"  # Add a slow zoom-in for dramatic effect
        zoom: 1.0
        duration: 3.0
