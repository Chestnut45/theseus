CutscenesAndDialogues:
  intro_sequence:
    characters:
      - name: "Theseus"
        portraitPath: "data/textures/sPlayerTest.png"
    sequence:
      - type: "dialogue"
        character: "Theseus"
        text: "Where am I?"
        duration: 3.0
      - type: "cutscene"
        camera_keyframes:
          - target: "Theseus" # Start at Theseus
            zoom: 1.0
            duration: 1.5
          - target: "Minotaur" # Move to Minotaur
            zoom: 1.5
            duration: 2.5
      - type: "dialogue"
        character: "Theseus"
        text: "A Minotaur?!"
        duration: 2.5
      - type: "combined"
        dialogue:
          character: "Theseus"
          text: "This can't be. I'm in hell."
          duration: 4.0

  hello:
    characters:
      - name: "Ariadne"
        portraitPath: "data/textures/sPlayerTest.png"
    sequence:
      - type: "dialogue"
        character: "Ariadne"
        text: "Hello, Theseus."
        duration: 2.0
